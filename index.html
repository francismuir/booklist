<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#8c3b2b" />
  <title>BookList — Reading &amp; Series Tracker</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%238c3b2b'/%3E%3Cpath d='M8 8h6a3 3 0 0 1 2 1 3 3 0 0 1 2-1h6v15h-6a3 3 0 0 0-2 1 3 3 0 0 0-2-1H8V8z' fill='%23faf7f2'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
        </span>
        <span class="brand-name">BookList</span>
      </a>

      <nav class="nav-links" id="top-nav" aria-label="Primary navigation">
        <a href="#/" data-route="/">On the Go</a>
        <a href="#/books" data-route="/books">Books</a>
        <a href="#/series" data-route="/series">Series</a>
        <a href="#/wishlist" data-route="/wishlist">Wishlist &amp; Prices</a>
        <a href="#/stats" data-route="/stats">Stats</a>
        <a href="#/settings" data-route="/settings">Sync &amp; Data</a>
      </nav>

      <div class="topbar-actions">
        <button id="btn-sync-github" class="sync-pill" type="button" title="Sync status">
          <span class="sync-dot"></span>
          <span class="sync-label">Local</span>
        </button>
        <button id="btn-add-book" class="btn btn-primary btn-sm" type="button">+ Add Book</button>
        <button id="btn-theme-toggle" class="btn btn-ghost btn-sm" type="button" title="Toggle theme" aria-label="Toggle theme">◐</button>
      </div>
    </div>
  </header>

  <div id="mode-banner" class="mode-banner hidden" role="status"></div>

  <main id="app-main" class="app-main" tabindex="-1">
    <div class="loading-state">Loading library…</div>
  </main>

  <nav class="mobile-nav" id="mobile-nav" aria-label="Mobile navigation">
    <a href="#/" data-route="/">Home</a>
    <a href="#/books" data-route="/books">Books</a>
    <a href="#/series" data-route="/series">Series</a>
    <a href="#/wishlist" data-route="/wishlist">Prices</a>
    <a href="#/stats" data-route="/stats">Stats</a>
    <a href="#/settings" data-route="/settings">Sync</a>
  </nav>

  <div id="modal-root" class="modal-root hidden" aria-hidden="true"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
